name = "accentforge-worker"
main = "src/index.ts"
compatibility_date = "2026-09-28"
# Production access is configured explicitly in Phase 8; no workers.dev endpoint.
workers_dev = false

# Per-location, approximate 60-second limits. Tune for shared school IPs before launch.
[[ratelimits]]
name = "POLISH_RATE_LIMIT"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "GENERATE_RATE_LIMIT"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "SPEECH_RATE_LIMIT"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 8
  period = 60

[[ratelimits]]
name = "COMBINED_RATE_LIMIT"
namespace_id = "1004"
  [ratelimits.simple]
  limit = 32
  period = 60

[[durable_objects.bindings]]
name = "GLOBAL_USAGE"
class_name = "GlobalUsage"

[[migrations]]
tag = "phase7-sqlite-usage-v1"
new_sqlite_classes = ["GlobalUsage"]

[vars]
# First production deployment is deliberately non-chargeable. Local .dev.vars
# may explicitly enable approved development testing; never copy it to Pages.
SECURITY_ENV = "production"
API_ENABLED = "false"
KIMI_ENABLED = "false"
MINIMAX_ENABLED = "false"
ALLOWED_ORIGINS = "https://accentforge.pages.dev"
TURNSTILE_ALLOWED_HOSTNAMES = "accentforge.pages.dev"
TURNSTILE_SITE_KEY = "0x4AAAAAAFWuKzqWsSWw9Zb6"
KIMI_DAILY_REQUEST_LIMIT = "150"
MINIMAX_DAILY_REQUEST_LIMIT = "40"

KIMI_BASE_URL = "https://api.moonshot.cn/v1"
KIMI_TEXT_MODEL = "kimi-k2.6"

MINIMAX_BASE_URL = "https://api.minimax.cn"
MINIMAX_TTS_MODEL = "speech-2.8-turbo"
MINIMAX_TTS_SPEED = "1.0"
MINIMAX_BRITISH_FEMALE_VOICE_ID = "English_Graceful_Lady"
MINIMAX_AMERICAN_FEMALE_VOICE_ID = "English_compelling_lady1"
MINIMAX_AMERICAN_MALE_VOICE_ID = "English_Trustworthy_Man"
MINIMAX_AUSTRALIAN_MALE_VOICE_ID = "English_Aussie_Bloke"

